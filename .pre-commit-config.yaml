# Generated/verification files that must stay byte-identical
exclude: ^artifacts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$  # MkDocs uses custom YAML tags not recognized by check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--preview]  # CI runs `ruff format --check --preview`

  # Runs mypy from the active environment (pip install -e ".[dev]") so it sees the
  # project's real dependencies, matching the CI type check.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy backend --strict
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
