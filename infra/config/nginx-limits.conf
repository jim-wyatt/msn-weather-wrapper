# Edge rate limiting (included into the http context from /etc/nginx/conf.d/).
# This is the authoritative per-client limit: the API's own limiter is per worker
# process, so with N gunicorn workers it allows up to N times its configured rate.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;
