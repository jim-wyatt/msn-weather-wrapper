version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: infra/containers/Containerfile
    container_name: msn-weather-app
    ports:
      - "8080:8080"
    # The image runs as a non-root user and needs no capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set for production}
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      RATE_LIMIT_ENABLED: "true"
      CACHE_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
