# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "jim-wyatt"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group patch updates together to reduce PR noise
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
    assignees:
      - "jim-wyatt"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group React ecosystem updates
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript updates
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Group test dependencies
      test-dependencies:
        patterns:
          - "*playwright*"
          - "*test*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions. "/" covers .github/workflows; composite actions under .github/actions
  # are only scanned when their directory is listed here.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-python-env"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
      - "github-actions"
    assignees:
      - "jim-wyatt"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group all GitHub Actions updates (including majors) into one PR
      github-actions:
        patterns:
          - "*"

  # Container base images. The FROM lines pin image digests, so without this the base
  # images never move and interpreter CVEs accumulate in the published image.
  # CI-only tools pinned outside the project's dependencies (Semgrep runs from its own pipx
  # environment so pip-audit never counts its transitive dependencies).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "jim-wyatt"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Dependabot's docker updater matches both Dockerfile and Containerfile names.
  - package-ecosystem: "docker"
    directories:
      - "/infra/containers"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "jim-wyatt"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Stay on the Python and Node release lines pinned in the Containerfiles. Jumping
      # to a new major/minor tag (e.g. node 24 -> 25) is a deliberate upgrade, not
      # maintenance; only digest and patch updates to the pinned tags flow through.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # One PR for all base image digest bumps
      base-images:
        patterns:
          - "*"
