name: 'Setup Python Environment'
description: 'Setup Python with caching and install dependencies (requires prior checkout)'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.15'
  cache-dependency-path:
    description: 'Path to dependency file for cache key'
    required: false
    default: 'pyproject.toml'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  dependency-groups:
    description: 'Dependency groups to install (e.g., "dev", "test", "lint")'
    required: false
    default: 'dev'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # The installed environment is cached as a whole, keyed on the dependency file and the
    # exact interpreter build (the venv symlinks into the tool cache), so a hit skips the
    # install entirely; setup-python's pip cache above only saves the downloads. The project
    # itself is always reinstalled without dependencies: it is cheap, and the cached copy
    # carries the metadata (version) of whichever run saved it.
    - name: Restore virtual environment
      if: inputs.install-dependencies == 'true'
      id: venv
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.setup.outputs.python-version }}-${{ inputs.dependency-groups }}-${{ hashFiles(inputs.cache-dependency-path) }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.venv.outputs.cache-hit }}
        GROUPS: ${{ inputs.dependency-groups }}
      run: |
        if [ "$CACHE_HIT" != "true" ]; then
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[$GROUPS]"
        fi
        .venv/bin/python -m pip install --no-deps -e .
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
