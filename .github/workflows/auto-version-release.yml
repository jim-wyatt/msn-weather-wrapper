name: Auto Version and Release

# Triggered manually by CI/CD Pipeline after tests pass
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number (if from PR merge)'
        required: false
        type: string
      pr_title:
        description: 'PR Title'
        required: false
        type: string
      pr_merged:
        description: 'Was PR merged'
        required: false
        type: string
        default: 'true'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-version:
    name: Auto Version Bump and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # RELEASE_TOKEN (fine-grained PAT or GitHub App token with Contents and Pull requests
      # write on this repository) makes the release hands-free: pull requests it opens get CI
      # on their own, and the tag it pushes triggers ci.yml and publish-release.yml natively.
      # Without it the workflow falls back to GITHUB_TOKEN, which may not open pull requests
      # (repository setting "Allow GitHub Actions to create and approve pull requests") and
      # whose pushes never trigger workflows.
      - name: Resolve release credentials
        id: creds
        run: |
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "release_token=true" >> $GITHUB_OUTPUT
            echo "🔑 RELEASE_TOKEN is configured: pull request and tag pushes trigger workflows natively"
          else
            echo "release_token=false" >> $GITHUB_OUTPUT
            echo "::notice::RELEASE_TOKEN is not configured; falling back to GITHUB_TOKEN (see docs/AUTOMATED_VERSIONING.md)"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Determine version bump type
        id: bump_type
        env:
          PR_TITLE: ${{ github.event.inputs.pr_title }}
        run: |
          echo "PR Title: $PR_TITLE"

          BUMP_TYPE="patch"

          # Check PR title for conventional commit prefixes
          if echo "$PR_TITLE" | grep -qiE "^(breaking|feat|feature)(\(.*\))?!:"; then
            BUMP_TYPE="major"
          elif echo "$PR_TITLE" | grep -qiE "^(feat|feature)(\(.*\))?:"; then
            BUMP_TYPE="minor"
          elif echo "$PR_TITLE" | grep -qiE "^(fix|bugfix|chore|perf|refactor|docs)(\(.*\))?:"; then
            BUMP_TYPE="patch"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "🎯 Bump type: $BUMP_TYPE"

      - name: Calculate new version
        id: version
        run: |
          # Get current version from latest git tag (source of truth), falling back to pyproject.toml
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || echo "")
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_VERSION=${LATEST_TAG#v}
          else
            CURRENT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $CURRENT_VERSION (from tag: ${LATEST_TAG:-none})"

          # Parse and increment version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🆕 New version: $NEW_VERSION"

      - name: Check if version already exists
        id: check
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # Check if tag exists
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag v$NEW_VERSION already exists"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # If main already carries the new version but the tag is missing, an earlier run
          # (or a maintainer) merged the bump and stopped before tagging. Resume at the tag step.
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep '^version = ' | sed 's/version = "\(.*\)"/\1/')
          if [ "$NEW_VERSION" == "$MAIN_VERSION" ]; then
            echo "bump=false" >> $GITHUB_OUTPUT
            echo "↩️  Version $NEW_VERSION is already in main but untagged - resuming release"
            exit 0
          fi

          echo "bump=true" >> $GITHUB_OUTPUT
          echo "✅ Version $NEW_VERSION is new"

      - name: Update version files
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.bump == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # Update pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # Update __init__.py
          if [ -f "backend/__init__.py" ]; then
            sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" backend/__init__.py
          fi

          echo "✏️  Updated version files to $NEW_VERSION"

      - name: Create version bump pull request
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN_PRESENT: ${{ steps.creds.outputs.release_token }}
          INPUT_PR_TITLE: ${{ github.event.inputs.pr_title }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH_NAME="chore/version-bump-$NEW_VERSION"

          # A previous run may already have opened the PR; reuse it instead of failing on push
          if [ -n "$(gh pr list --head "$BRANCH_NAME" --state open --json number -q '.[0].number')" ]; then
            echo "ℹ️  Version bump PR for $NEW_VERSION already exists - reusing it"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and checkout new branch
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git add pyproject.toml backend/__init__.py
          git commit -m "chore: bump version to $NEW_VERSION" \
                     -m "Auto-generated version bump" \
                     -m "Version: ${{ steps.version.outputs.current }} → $NEW_VERSION" \
                     -m "Bump Type: ${{ steps.bump_type.outputs.bump_type }}" \
                     -m "Triggered by: PR #$INPUT_PR_NUMBER - $INPUT_PR_TITLE"

          # Push branch
          git push -u origin "$BRANCH_NAME"

          # Create PR. With GITHUB_TOKEN this fails when the repository does not allow
          # Actions to create pull requests; the branch is already pushed, so print the
          # exact recovery and stop.
          if ! gh pr create \
            --title "chore: bump version to $NEW_VERSION" \
            --body "## Version Bump

          - **Previous**: v${{ steps.version.outputs.current }}
          - **New**: v$NEW_VERSION
          - **Bump Type**: ${{ steps.bump_type.outputs.bump_type }}
          - **Triggered by**: PR #$INPUT_PR_NUMBER - $INPUT_PR_TITLE

          This PR was automatically generated by the auto-version workflow. Once approved and merged, it will trigger the publish-release workflow to create a release tag." \
            --base main \
            --head "$BRANCH_NAME"; then
            echo "::error title=Could not open the version bump pull request::The branch $BRANCH_NAME is pushed. Either add a RELEASE_TOKEN secret (fine-grained token with Contents and Pull requests write; see docs/AUTOMATED_VERSIONING.md) so this is automatic, or recover by hand:  gh pr create --base main --head $BRANCH_NAME --title 'chore: bump version to $NEW_VERSION'  and then re-run this workflow with the same inputs; it resumes at the existing pull request."
            if [ "$RELEASE_TOKEN_PRESENT" != "true" ]; then
              echo "::error::GITHUB_TOKEN cannot create pull requests here (repository setting 'Allow GitHub Actions to create and approve pull requests' is off)."
            fi
            exit 1
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          echo "✅ Created version bump PR #$PR_NUMBER"
          echo "📦 Version: ${{ steps.version.outputs.current }} → $NEW_VERSION"

      - name: Wait for CI Gate on the version bump PR
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH_NAME="chore/version-bump-$NEW_VERSION"
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/$PR_NUMBER"

          # Branch protection requires the "CI Gate" check from the pull request's own run.
          echo "::notice::Waiting for CI Gate on $PR_URL. If its checks say 'Approve and run workflows', a maintainer must approve them."
          for attempt in $(seq 1 90); do
            CONCLUSION=$(gh pr view "$PR_NUMBER" --json statusCheckRollup \
              -q '[.statusCheckRollup[] | select(.name == "CI Gate" and .status == "COMPLETED")][0].conclusion // empty')
            if [ "$CONCLUSION" == "SUCCESS" ]; then
              echo "✅ CI Gate passed"
              exit 0
            elif [ -n "$CONCLUSION" ]; then
              echo "::error::CI Gate finished with $CONCLUSION on $PR_URL"
              exit 1
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for CI Gate on $PR_URL. Approve its workflow run if it is waiting, then re-run this workflow; it resumes where it stopped."
          exit 1

      - name: Merge version bump PR
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.bump == 'true'
        id: merge_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH_NAME="chore/version-bump-$NEW_VERSION"

          # Get the PR number
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find PR for branch $BRANCH_NAME"
            exit 1
          fi

          # Merge synchronously: the tag step below must run after the merge has landed
          gh pr merge "$PR_NUMBER" --squash

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Merged version bump PR #$PR_NUMBER"

      - name: Clean up release branch
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH_NAME="chore/version-bump-$NEW_VERSION"

          # Delete the remote branch
          gh api repos/{owner}/{repo}/git/refs/heads/"$BRANCH_NAME" -X DELETE || {
            echo "⚠️  Could not delete branch via API, attempting via git..."
            git push origin --delete "$BRANCH_NAME" || echo "⚠️  Branch deletion failed, but release process continues"
          }

          echo "🗑️  Deleted release branch: $BRANCH_NAME"

      - name: Create release tag
        if: steps.check.outputs.skip == 'false'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_TITLE: ${{ github.event.inputs.pr_title }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # Wait for merge to be processed
          echo "⏳ Waiting for PR merge to be processed..."
          sleep 5

          # Discard the version-file edits left in the workspace by the earlier step (on a
          # resumed run they were never committed here) and move to the merged main
          git checkout -- pyproject.toml backend/__init__.py 2>/dev/null || true
          git fetch origin main
          git checkout -B main origin/main

          # Get the latest commit SHA on main
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "📍 Tagging commit: $COMMIT_SHA"

          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "v$NEW_VERSION" "$COMMIT_SHA" \
                  -m "Release v$NEW_VERSION" \
                  -m "Auto-generated from: $INPUT_PR_TITLE" \
                  -m "Bump type: ${{ steps.bump_type.outputs.bump_type }}"

          # Pushed with the checkout credentials: with RELEASE_TOKEN this push triggers
          # ci.yml (versioned container image) and publish-release.yml (PyPI, GitHub
          # release) on its own; with GITHUB_TOKEN it does not, and the steps below
          # dispatch them explicitly.
          git push origin "v$NEW_VERSION"
          echo "tag=${{ steps.merge_pr.outputs.pr_number }}" >> $GITHUB_OUTPUT
          echo "🏷️  Created and pushed tag v$NEW_VERSION at commit $COMMIT_SHA"

      - name: Trigger publish-release workflow
        # Only needed when the tag was pushed with GITHUB_TOKEN (no native trigger)
        if: steps.check.outputs.skip == 'false' && steps.creds.outputs.release_token != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # Wait a moment for tag to be fully processed
          sleep 5

          # Trigger publish-release workflow with the new version tag
          gh workflow run publish-release.yml \
            -f tag="v$NEW_VERSION"

          echo "🚀 Triggered publish-release workflow for v$NEW_VERSION"

      - name: Trigger CI pipeline on the release tag
        # Only needed when the tag was pushed with GITHUB_TOKEN (no native trigger)
        if: steps.check.outputs.skip == 'false' && steps.creds.outputs.release_token != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"

          # A tag pushed with GITHUB_TOKEN does not trigger workflows, so the tag run of
          # ci.yml that publishes the versioned container image (X.Y.Z, X.Y, X, latest)
          # never started on its own (2.0.14 shipped without an image tag). Dispatch it
          # explicitly, as publish-release is dispatched above.
          gh workflow run ci.yml --ref "v$NEW_VERSION"

          echo "🐳 Triggered CI/CD Pipeline for v$NEW_VERSION (versioned container image)"

      - name: Generate summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" == "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # ℹ️  No Version Bump Needed

          Version ${{ steps.version.outputs.new }} already exists or is already in main.

          **Current version**: ${{ steps.version.outputs.current }}
          **Would-be version**: ${{ steps.version.outputs.new }}
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🎉 Version Bump Complete!

          ## Version Change
          - **Previous**: v${{ steps.version.outputs.current }}
          - **New**: v${{ steps.version.outputs.new }}
          - **Bump Type**: ${{ steps.bump_type.outputs.bump_type }}

          ## Actions Taken
          1. ✅ Version bump PR #${{ steps.merge_pr.outputs.pr_number }} created and merged
          2. 🏷️ Tag v${{ steps.version.outputs.new }} created
          3. 🚀 Publish workflow triggered

          ## Bump Type Rules
          - **Major (X.0.0)**: breaking changes, labels: `major`, `breaking`
          - **Minor (0.X.0)**: new features, labels: `minor`, `feature`
          - **Patch (0.0.X)**: bug fixes, everything else (default)
          EOF
          fi
