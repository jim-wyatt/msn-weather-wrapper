name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  # No path filter: "CI Gate" is a required status check, so it has to report on every PR
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer run for the same ref and event supersedes the one in flight
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  # Decide whether this change needs the full pipeline. Pull requests that touch only
  # documentation or repository metadata skip the heavy jobs; everything else runs them.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$CHANGED"
          # Anything outside these documentation/metadata paths counts as code
          if echo "$CHANGED" | grep -qvE '^(docs/|artifacts/|[^/]+\.md$|LICENSE$|\.github/[^/]+\.md$|\.github/ISSUE_TEMPLATE/|\.github/CODEOWNERS$|\.github/workflows/[^/]+\.md$|(backend|frontend|infra|scripts)/.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Test Phase: Run all tests including smoke, unit, integration, and coverage
  test:
    name: Run Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      python-version: '3.12'
      run-integration: false

  # Security Phase: Run security scans (full on main branch and tags, basic on PR)
  security:
    name: Run Security Scans
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      python-version: '3.12'
      full-scan: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

  # Build Phase: Build Docker images and documentation
  build:
    name: Build Artifacts
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      python-version: '3.12'
      push-image: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    secrets: inherit

  # Integration Tests: Run after build with the Docker image
  integration-tests:
    name: Integration Tests
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      python-version: '3.12'
      run-integration: true
      artifact-suffix: '-integration'

  # Gate: the single status check required by branch protection on main.
  # Fails unless every blocking job above succeeded. Skipped jobs only pass for documentation-only changes.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, test, security, build, integration-tests]
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ needs.test.result }} ${{ needs.security.result }} ${{ needs.build.result }} ${{ needs.integration-tests.result }}
        run: |
          echo "Change detection: $CHANGES_RESULT (code=$CODE_CHANGED)"
          echo "Job results: $RESULTS"
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi
          if [[ "$CODE_CHANGED" == "false" ]]; then
            echo "Documentation-only change: test, security, and build jobs were skipped by design."
            exit 0
          fi
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI job did not succeed ($RESULTS)"
              exit 1
            fi
          done

  # Performance Tests: Run performance benchmarks and load tests
  performance:
    name: Performance Tests
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/performance.yml
    with:
      python-version: '3.12'

  # Deploy Phase: Generate reports and deploy documentation (main branch only)
  deploy:
    name: Deploy Documentation
    needs: [integration-tests, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      python-version: '3.12'
    secrets: inherit

  # Trigger Auto-Version-Release: After successful CI on main branch
  trigger-auto-version:
    name: Trigger Auto-Version-Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    needs: [test, security, build, integration-tests, deploy]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest merged PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number -q '.[0].number')

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No recent merged PR found - skipping auto-version"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')

          # Skip if the last merged PR was itself a version-bump PR to avoid infinite loops
          if echo "$PR_TITLE" | grep -qiE "^chore: bump version to"; then
            echo "Last merged PR was a version bump - skipping auto-version to prevent infinite loop"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          {
            echo "pr_title<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Found merged PR #$PR_NUMBER: $PR_TITLE"

      - name: Trigger Auto-Version-Release workflow
        if: steps.pr_info.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
        run: |
          gh workflow run auto-version-release.yml \
            -f pr_number="$PR_NUMBER" \
            -f pr_title="$PR_TITLE" \
            -f pr_merged="true"

          echo "✓ Triggered auto-version-release workflow for PR #$PR_NUMBER"
