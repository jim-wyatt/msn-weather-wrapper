name: Build

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version for build'
        required: false
        type: string
        default: '3.15'
      push-image:
        description: 'Whether to push the container image to registry'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: ${{ inputs.python-version }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # sign the image attestation with the workflow's OIDC identity
      attestations: write   # store the attestation on GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: inputs.push-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        id: push
        if: inputs.push-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/containers/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Signed build provenance for the pushed image, verifiable with
      # `gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>`
      - name: Attest container image provenance
        if: inputs.push-image && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build all container images
        if: ${{ !inputs.push-image }}
        run: |
          docker buildx build -t msn-weather-app:test -f ./infra/containers/Containerfile --load .
          docker buildx build -t msn-weather-frontend:test -f ./frontend/Containerfile --load ./frontend
          docker buildx build -t msn-weather-playwright:test -f ./infra/containers/Containerfile.playwright --load .

      - name: Test unified container
        if: ${{ !inputs.push-image }}
        run: |
          docker rm -f test-app || true
          test_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$test_secret"
          # No --rm: if the container exits early its logs must still be readable below
          docker run -d --name test-app -p 8080:8080 --cap-drop ALL --security-opt no-new-privileges \
            -e "APP_SECRET_KEY=$test_secret" \
            msn-weather-app:test
          sleep 15
          # Print the container's output if a probe fails so the cause is visible in the log
          probe() { curl -fsS "$1" > /dev/null || { echo "::error::$1 did not respond"; docker ps -a --filter name=test-app; docker logs test-app || true; exit 1; }; }
          probe http://localhost:8080/api/v1/health
          probe http://localhost:8080/
          docker rm -f test-app || true

      - name: Save Docker images as artifacts
        if: ${{ !inputs.push-image && github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/docker-images
          docker save msn-weather-app:test -o /tmp/docker-images/api.tar
          docker save msn-weather-frontend:test -o /tmp/docker-images/frontend.tar
          docker save msn-weather-playwright:test -o /tmp/docker-images/playwright.tar
          cd /tmp/docker-images
          tar -czf docker-images.tar.gz *.tar
          rm -f *.tar

      - name: Upload Docker images artifact
        if: ${{ !inputs.push-image && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-images
          path: /tmp/docker-images/docker-images.tar.gz
          retention-days: 5

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCAL_BIN: /tmp/syft-bin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Syft
        run: |
          mkdir -p "$LOCAL_BIN"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$LOCAL_BIN"
          echo "$LOCAL_BIN" >> "$GITHUB_PATH"

      - name: Generate Source SBOM
        run: |
          mkdir -p sbom_output
          syft dir:. -o spdx-json > sbom_output/source_sbom.json
          syft dir:. -o cyclonedx-json > sbom_output/source_cyclonedx.json

      - name: Upload SBOM artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-reports
          path: sbom_output/
          retention-days: 7

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dependencies: 'false'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install MkDocs
        run: python -m pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: site/
          retention-days: 7
