name: Security

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version for security scans'
        required: false
        type: string
        default: '3.12'
      full-scan:
        description: 'Whether to run full security scan (SAST, dependencies, container)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: ${{ inputs.python-version }}

jobs:
  basic-security:
    name: Basic Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit semgrep pip-audit pip-licenses

      - name: Create security reports directory
        run: mkdir -p security-reports

      - name: Run Bandit (fail on HIGH severity)
        run: |
          if bandit -r backend/ -lll -f json -o security-reports/bandit-report.json; then
            echo 0 > security-reports/bandit-exit-code
          else
            echo "$?" > security-reports/bandit-exit-code
          fi

      - name: Run Semgrep SAST scan
        run: |
          if semgrep --error --config=p/python --metrics=off backend/ --json --output=security-reports/semgrep-report.json; then
            echo 0 > security-reports/semgrep-exit-code
          else
            echo "$?" > security-reports/semgrep-exit-code
          fi

      - name: Run pip-audit (check for vulnerabilities)
        run: |
          if pip-audit --format json --output security-reports/pip-audit-report.json; then
            echo 0 > security-reports/pip-audit-exit-code
          else
            echo "$?" > security-reports/pip-audit-exit-code
          fi

      - name: Generate pip-licenses report
        run: |
          pip-licenses --format=json --output-file=security-reports/licenses.json

      - name: Evaluate security scan reports
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("security-reports")
          failures = []
          findings = {}
          scan_errors = {}

          def load_report(name):
              try:
                  return json.loads((reports / name).read_text())
              except (OSError, json.JSONDecodeError) as error:
                  failures.append(f"{name}: could not read scan report ({error})")
                  return {}

          bandit = load_report("bandit-report.json")
          bandit_findings = [
              item for item in bandit.get("results", [])
              if item.get("issue_severity") == "HIGH"
          ]
          findings["bandit"] = bool(bandit_findings)
          scan_errors["bandit"] = bool(bandit.get("errors"))
          if bandit_findings or bandit.get("errors"):
              failures.append("Bandit reported HIGH findings or scan errors")

          semgrep = load_report("semgrep-report.json")
          findings["semgrep"] = bool(semgrep.get("results"))
          scan_errors["semgrep"] = bool(semgrep.get("errors"))
          if semgrep.get("results") or semgrep.get("errors"):
              failures.append("Semgrep reported findings or scan errors")

          pip_audit = load_report("pip-audit-report.json")
          vulnerabilities = [
              vulnerability
              for dependency in pip_audit.get("dependencies", [])
              for vulnerability in dependency.get("vulns", [])
          ]
          findings["pip-audit"] = bool(vulnerabilities)
          scan_errors["pip-audit"] = bool(pip_audit.get("errors"))
          if vulnerabilities or pip_audit.get("errors"):
              failures.append("pip-audit reported vulnerabilities or scan errors")

          for scan in ("bandit", "semgrep", "pip-audit"):
              try:
                  exit_code = int((reports / f"{scan}-exit-code").read_text())
              except (OSError, ValueError) as error:
                  failures.append(f"{scan}: missing or invalid exit code ({error})")
                  continue
              if exit_code and not findings.get(scan) and not scan_errors.get(scan):
                  failures.append(f"{scan} exited with status {exit_code}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              with open(os.environ["GITHUB_ENV"], "a") as environment:
                  environment.write("SECURITY_SCAN_FAILED=true\n")
          PY

      - name: Upload security reports as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: security-reports/
          retention-days: 3

      - name: Security scan summary
        if: always()
        run: |
          if [[ "${SECURITY_SCAN_FAILED:-false}" == "true" ]]; then
            echo "::error::Security findings or scan errors detected; review the scan reports."
            exit 1
          fi
          echo "Security scans completed without findings or scan errors."
          echo "✓ License report generated"

  container-scan:
    name: Container Security Scan
    if: ${{ inputs.full-scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./infra/containers/Containerfile
          push: false
          tags: msn-weather-app:security-scan
          cache-from: type=gha
          load: true

      - name: Create security reports directory
        run: mkdir -p security-reports

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: msn-weather-app:security-scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: 'true'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: Run Trivy for JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: msn-weather-app:security-scan
          format: 'json'
          output: 'security-reports/trivy-results.json'

      - name: Generate Grype SBOM scan
        run: |
          mkdir -p /tmp/sbom-tools
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp/sbom-tools
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/sbom-tools
          /tmp/sbom-tools/syft msn-weather-app:security-scan -o spdx-json > security-reports/container-sbom.json
          /tmp/sbom-tools/grype sbom:security-reports/container-sbom.json --fail-on critical -o json > security-reports/grype-results.json || true

      - name: Upload container security reports
        uses: actions/upload-artifact@v7
        with:
          name: container-security-reports
          path: security-reports/
          retention-days: 30

      - name: Container security summary
        run: |
          echo "✓ Trivy container scan completed"
          echo "✓ Grype SBOM scan completed"
