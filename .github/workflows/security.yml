name: Security

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version for security scans'
        required: false
        type: string
        default: '3.15'
      full-scan:
        description: 'Whether to run full security scan (SAST, dependencies, container)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: ${{ inputs.python-version }}

jobs:
  basic-security:
    name: Basic Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          # Semgrep goes in its own pipx environment. Its pinned transitive dependencies
          # (mcp, opentelemetry-*) are not project dependencies and do not ship in the
          # image, so they must not end up in the environment that pip-audit scans.
          pipx install semgrep
          pip install bandit pip-audit pip-licenses

      - name: Create security reports directory
        run: mkdir -p security-reports

      - name: Run Bandit (fail on HIGH severity)
        run: |
          # Report every severity; evaluate_security_reports.py gates on HIGH
          status=0
          bandit -r backend/ --exit-zero -f json -o security-reports/bandit-report.json || status=$?
          echo "$status" > security-reports/bandit-exit-code

      - name: Run Semgrep SAST scan
        run: |
          status=0
          semgrep --error --config=p/python --config=p/security-audit --config=.semgrep.yml --metrics=off backend/ --json --output=security-reports/semgrep-report.json || status=$?
          echo "$status" > security-reports/semgrep-exit-code

      - name: Run pip-audit (check for vulnerabilities)
        run: |
          status=0
          pip-audit --format json --output security-reports/pip-audit-report.json || status=$?
          echo "$status" > security-reports/pip-audit-exit-code

      - name: Generate pip-licenses report
        run: |
          pip-licenses --format=json --output-file=security-reports/licenses.json

      - name: Evaluate security scan reports
        if: always()
        run: python scripts/evaluate_security_reports.py security-reports

      - name: Upload security reports as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: security-reports/
          retention-days: 3

      - name: Security scan summary
        if: always()
        run: |
          if [[ "${SECURITY_SCAN_FAILED:-false}" == "true" ]]; then
            echo "::error::Security findings or scan errors detected; review the scan reports."
            exit 1
          fi
          echo "Security scans completed without findings or scan errors."

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/containers/Containerfile
          push: false
          tags: msn-weather-app:security-scan
          cache-from: type=gha
          load: true

      - name: Create security reports directory
        run: mkdir -p security-reports

      - name: Run Trivy vulnerability scanner
        if: ${{ inputs.full-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: msn-weather-app:security-scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: 'true'

      - name: Upload Trivy results to GitHub Security
        if: ${{ inputs.full-scan }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: Run Trivy for JSON report
        if: ${{ inputs.full-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: msn-weather-app:security-scan
          format: 'json'
          output: 'security-reports/trivy-results.json'

      - name: Generate Grype SBOM scan
        if: ${{ inputs.full-scan }}
        run: |
          mkdir -p /tmp/sbom-tools
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp/sbom-tools
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/sbom-tools
          /tmp/sbom-tools/syft msn-weather-app:security-scan -o spdx-json > security-reports/container-sbom.json
          /tmp/sbom-tools/grype sbom:security-reports/container-sbom.json --fail-on critical -o json > security-reports/grype-results.json || true

      # Gate: runs on every pipeline, pull requests included. Fails when the image ships a
      # CRITICAL or HIGH vulnerability that has a fix available. Findings with no fix yet
      # (most base-image OS packages) are reported by the steps above but do not block.
      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: msn-weather-app:security-scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '1'

      # Gate: runs on every pipeline, pull requests included. Grype also version-scans the
      # interpreter binaries in the image (python, node), which Trivy does not, so a stale
      # base image fails here. Only findings with a published fix count; unfixed OS
      # findings are reported by the full scan above but do not block.
      - name: Fail on fixable CRITICAL vulnerabilities (Grype)
        run: |
          mkdir -p /tmp/sbom-tools
          if [ ! -x /tmp/sbom-tools/grype ]; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/sbom-tools
          fi
          /tmp/sbom-tools/grype msn-weather-app:security-scan --only-fixed --fail-on critical -o table

      - name: Upload container security reports
        if: ${{ inputs.full-scan && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-reports
          path: security-reports/
          retention-days: 30

      - name: Container security summary
        run: |
          echo "✓ Trivy container scan completed"
          echo "✓ Grype SBOM scan completed"
