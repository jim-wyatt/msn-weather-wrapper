name: Publish Release

# Runs on the tag that ci.yml creates after a green main run. The tagged commit is the
# one that run tested, scanned and pushed as an image, so nothing is rebuilt or re-tested
# here: build the Python package from the tag (version via hatch-vcs), attest it, publish
# it to PyPI, verify the versioned image exists, and create the GitHub release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.1.7)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.15'

jobs:
  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG#v}"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          ls -l dist
          # The wheel version must equal the tag (hatch-vcs reads the tag from the checkout)
          test -f "dist/msn_weather_wrapper-${{ steps.version.outputs.version }}-py3-none-any.whl"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-package]
    environment:
      name: pypi
      url: https://pypi.org/p/msn-weather-wrapper
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-package, publish-pypi]
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.build-package.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - name: Verify the versioned container image was published by the main run
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${VERSION}" > /dev/null \
            && echo "image ghcr.io/${{ github.repository }}:${VERSION} present" \
            || echo "::warning::ghcr.io/${{ github.repository }}:${VERSION} not found; the main run that produced this tag should have pushed it"
      - name: Release notes
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${VERSION}$" | head -n 1)
          {
            echo "## v${VERSION}"
            echo
            echo "### Changes since ${PREV:-the beginning}"
            git log --format='- %s (%h)' "${PREV:+$PREV..}v${VERSION}"
            echo
            echo "### Artifacts"
            echo "- PyPI: https://pypi.org/project/msn-weather-wrapper/${VERSION}/"
            echo "- Container: \`ghcr.io/${{ github.repository }}:${VERSION}\`"
            echo "- Verify: \`gh attestation verify oci://ghcr.io/${{ github.repository }}:${VERSION} --repo ${{ github.repository }}\`"
          } > release-notes.md
          cat release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: dist/*
